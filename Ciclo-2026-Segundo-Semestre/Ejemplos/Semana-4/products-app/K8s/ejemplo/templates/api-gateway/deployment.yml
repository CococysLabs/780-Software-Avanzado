apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api-gateway
  name: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  strategy: {}
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - image: api-gateway
        name: api-gateway
        env:
            - name: PORT
              value: "3000"
            - name: NATS_SERVERS
              value: "nats://nats"
        imagePullPolicy: Never
        resources: {}
status: {}

